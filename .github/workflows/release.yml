name: Test and package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest
      - run: python -m pytest -q
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build uv
      - run: python -m build --wheel
      - run: python scripts/package_release.py --windows-x64
      - run: python tests/windows_package.py
      - name: Publish preview with verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.zip dist/SHA256SUMS.txt --verify-tag --prerelease --title "Яндекс Диск $GITHUB_REF_NAME" --notes "Предварительная версия. Инструкции по установке, доступу и ограничениям находятся в README. Автоматические проверки Windows и Linux пройдены."
